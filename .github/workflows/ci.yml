name: CI
on:
  push:
    branches: [integration, main]
  pull_request:
    branches: [integration, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Upgrade pip and build tools
        run: pip install --upgrade pip setuptools wheel

      # CI has no GPU; the default torch wheel is 916 MB and drags in ~3 GB of
      # unused CUDA/nvidia packages. Pre-install the 189 MB CPU build so the
      # requirements.txt step finds torch already satisfied and skips all of it.
      - name: Install PyTorch (CPU-only)
        run: pip install torch==2.10.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Mypy type-check
        working-directory: backend
        run: mypy app tests

      - name: Pytest
        run: PYTHONPATH=backend python -m pytest backend/tests/ -v

      # REPORT-ONLY (SEC-9): Python SAST. -ll = medium+ severity only.
      - name: Bandit (SAST, report-only)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r app -ll

      # REPORT-ONLY (DEP-5): Python dependency CVE scan against the pinned lockfile.
      - name: pip-audit (dep CVEs, report-only)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # REPORT-ONLY (DEP-2): the audio worker imports webrtcvad, which is NOT in
      # requirements.txt — so this import fails on any clean machine. This step makes
      # that failure visible in CI instead of at runtime on Railway. Flip to gating
      # (remove continue-on-error) the moment webrtcvad is added to the lockfile.
      - name: Import smoke — undeclared deps (report-only)
        continue-on-error: true
        run: PYTHONPATH=backend python -c "import webrtcvad; print('webrtcvad import OK')"

  go-backend:
    name: Go backend — build, vet, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Format check (gofmt)
        working-directory: backend
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test -race ./...

      # REPORT-ONLY (SEC-9): Go SAST. Surfaces High/Critical without blocking;
      # flip to gating once the go-backend findings are triaged (STANDARDS_DEBT.md).
      - name: gosec (SAST, report-only)
        working-directory: backend
        continue-on-error: true
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" ./...

      # REPORT-ONLY (DEP-5): Go dependency CVE scan.
      - name: govulncheck (dep CVEs, report-only)
        working-directory: backend
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: TypeScript type-check
        run: cd frontend && npm run type-check

      # GATING (TEST-1): vitest was never run in CI before — all 5 suites were
      # non-gating. It is green (33 tests), so it now blocks merge like the others.
      - name: Vitest
        run: cd frontend && npm test

      - name: Build
        env:
          # Publishable key is public (ships in the client bundle); needed at build time.
          # Dependabot and fork PRs cannot read Actions secrets, so fall back to a
          # dummy public key — the build only needs a valid-format key to prerender,
          # and the real key is injected on the actual deploy (Vercel).
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_Y2xlcmsuZXhhbXBsZS5jb20k' }}
        run: cd frontend && npm run build

      # REPORT-ONLY (DEP-5): surfaces High/Critical npm CVEs without blocking.
      # Flip to gating once the frontend dep debt is cleared (see STANDARDS_DEBT.md).
      - name: npm audit (report-only)
        continue-on-error: true
        run: cd frontend && npm audit --audit-level=high

  # REPORT-ONLY (SEC-5): scan the full history + diff for committed secrets / .env.
  # Report-only because history predates the secret hygiene work (Phase D scrubs it);
  # flip to gating after the history is clean.
  secret-scan:
    name: Secret scan (gitleaks, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
